name: Bug report
description: Something in SkyStamp misbehaves.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SkyStamp version and platform
      placeholder: e.g. 0.1.0 on Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Last ~30 lines from the export log (open the log via settings).
      render: text
  - type: input
    id: drone
    attributes:
      label: Drone model (if footage-related)
