name: Drone report
description: Help verify telemetry support for your drone — the first three confirmed reports per model each earn a Contributor license (never expires, lifetime updates).
title: "[Drone] "
labels: ["drone-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! A complete report lets us confirm your model quickly.
        The first three confirmed reports per model each earn a Contributor license
        (never expires, lifetime updates). "Confirmed" = we've verified SkyStamp's
        telemetry parsing against your sample.

        **Most wanted right now:** the **DJI Neo** (the first-generation one — the
        Neo 2 is a different drone and nothing from the Neo has reached us at all)
        and the **DJI Osmo Action 4/5/6** (its decoder is written but has never met
        a real file). Any other model is just as welcome.

        **Privacy note before you paste anything:** this issue is public, forever.
        SRT entries and file metadata may contain your takeoff GPS — usually your
        home. Feel free to replace lat/long digits with zeros; we only need the
        format, not your location.
  - type: input
    id: model
    attributes:
      label: Drone model
      placeholder: e.g. DJI Mini 5 Pro
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: "10-second lookup — in DJI Fly: Profile → Device Management. Firmware decides telemetry behaviour, so a report can't be placed in the matrix confidently without it."
      placeholder: e.g. 01.00.0500
    validations:
      required: true
  - type: dropdown
    id: srt
    attributes:
      label: With Video Captions/Subtitles turned ON in DJI Fly, does your drone write a .SRT file next to the video?
      description: Check the setting first, record a short clip, then answer — many drones only write the file once the setting is on.
      options:
        - "Yes — .SRT appears next to the video"
        - "No — captions on, but no .SRT written"
        - "Can't check right now"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File listing of one flight
      description: "Paste `ls DJI_XXXX*` (or a screenshot) for a single flight — this captures the SRT, audio sidecar (.M4A), .LRF proxies, and naming convention in one go."
      render: text
    validations:
      required: true
  - type: textarea
    id: ffprobe
    attributes:
      label: ffprobe output
      description: "Run: `ffprobe -v quiet -print_format json -show_format -show_streams YOUR_CLIP.MP4` (or `.MOV` — both welcome) and paste the output. May contain takeoff GPS in metadata — zero the digits if you prefer, the structure is what matters."
      render: json
    validations:
      required: true
  - type: textarea
    id: srt-sample
    attributes:
      label: SRT sample (if present)
      description: "Paste the first ~10 entries of the .SRT file. These contain your takeoff coordinates — replacing lat/long digits with zeros is fine, we only need the format."
      render: text
  - type: textarea
    id: sample
    attributes:
      label: Sample clip link
      description: |
        **Please send the file as it came off the drone — don't trim it.**

        This asked for a trimmed clip until August 2026, and that advice was
        wrong. On any drone that writes embedded telemetry, `ffmpeg -t 5 -map 0
        -c copy` either fails outright (`Could not find tag for codec none in
        stream #1`) or, remuxed to `.MOV`, rewrites the data track's sample
        description — the bytes travel, the meaning doesn't, and the telemetry
        no longer decodes. The embedded stream is the part we most need, so a
        trimmed clip is the one thing that can't do this job.

        A short flight is perfectly fine if you have one — **outdoors with GPS
        lock**, and a hover exercises the trickiest parsing. But send it whole.

        Upload it (plus the matching .SRT/.M4A if present) to any file-sharing
        service (Drive, WeTransfer, …) and paste the link. Too large, or you'd
        rather not post a link publicly? Say so here and we'll arrange a direct
        transfer. Editor exports and re-encodes lose the telemetry and can't be
        used.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Footage use
      options:
        - label: The sample may be used to verify parsing
          required: true
  - type: dropdown
    id: retention
    attributes:
      label: After verification, the sample should be…
      options:
        - "kept as a private test fixture (the full file, kept private — never redistributed or published)"
        - "deleted entirely"
    validations:
      required: true
